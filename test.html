<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>🔌 Test Connection</h1>
    <input type="text" id="name" placeholder="Name" />
    <button onclick="addData()">➕ Add</button>
    <button onclick="loadData()">📋 Load</button>
    <div id="result"></div>

    <script>
        // Supabase Setup
        const SUPABASE_URL = 'https://rpyymyiwjxnztzxqef.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJweW15bWl3ZWpueHR6eHFlZnZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTI3NzYsImV4cCI6MjEwNDE2ODc3Nn0.g5dDTzf-A-DJEVxwua9giVlPbIyqdhHENRrM-f04pdk';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function addData() {
            const name = document.getElementById('name').value;
            if (!name) { alert('Name dalo!'); return; }
            
            try {
                document.getElementById('result').innerHTML = '⏳ Adding...';
                const { data, error } = await supabase
                    .from('customers')
                    .insert([{ name: name, type: '10', balance: 0, history: [] }])
                    .select();
                    
                if (error) throw error;
                document.getElementById('result').innerHTML = '✅ Added: ' + name;
                console.log('Success:', data);
            } catch (error) {
                document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
                console.error('Error:', error);
            }
        }

        async function loadData() {
            try {
                document.getElementById('result').innerHTML = '⏳ Loading...';
                const { data, error } = await supabase
                    .from('customers')
                    .select('*');
                    
                if (error) throw error;
                document.getElementById('result').innerHTML = '📋 Total: ' + data.length + ' customers';
                console.log('Data:', data);
            } catch (error) {
                document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
