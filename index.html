<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monty - Hisab</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f4f6f8;padding:10px;max-width:500px;margin:auto}
.card{background:white;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0002}
input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#1a73e8;color:white;font-weight:bold;border:0;cursor:pointer;border-radius:8px}
.green{background:#34a853}.red{background:#ea4335}.orange{background:#f9a825;color:#000}
.customer{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.pos{color:#34a853;font-weight:bold}.neg{color:#ea4335;font-weight:bold}
.hidden{display:none}.total{font-size:32px;font-weight:bold;text-align:center}
.flex{display:flex;gap:5px}.flex button{flex:1}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="home">
<div class="card"><div class="total" id="grand">0</div><div style="text-align:center;">💰 Total Balance</div></div>
<div class="card">
<input id="newName" placeholder="Customer name">
<button onclick="addCustomer()">+ Customer Add</button>
</div>
<div class="card"><h3>📋 Customers</h3><div id="customers"></div></div>
</div>

<!-- ===== DETAIL ===== -->
<div id="detail" class="hidden">
<button onclick="goHome()">← Back</button>
<div class="card"><h2 id="cname"></h2><div class="total" id="balance">0</div></div>

<div class="card"><h4>📤 SMS (Customer ne SMS kiye → aapko dena hai)</h4>
<input id="smsCount" placeholder="SMS count">
<input id="smsRate" placeholder="Rate per SMS">
<button class="red" onclick="addSMS()">📤 SMS (-)</button></div>

<div class="card"><h4>💰 Customer ko Diye (+) / Mile (-)</h4>
<input id="amount" placeholder="Coins">
<div class="flex">
<button class="green" onclick="addTx(1)">✅ Diye (+)</button>
<button class="red" onclick="addTx(-1)">❌ Mile (-)</button>
</div></div>

<div class="card"><h3>📜 History</h3><div id="history"></div></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('montyData') || '{}');
let current = null;

function save() { localStorage.setItem('montyData', JSON.stringify(data)); render(); }

function addCustomer() {
  let n = document.getElementById('newName').value.trim();
  if(!n) return alert('Naam likho!');
  if(data[n]) return alert('Already exists!');
  data[n] = { tx: [] };
  document.getElementById('newName').value = '';
  save();
}

function render() {
  let box = document.getElementById('customers'); box.innerHTML = '';
  let total = 0;
  for(let c in data) {
    let s = data[c].tx.reduce((a,x) => a + x.v, 0);
    total += s;
    box.innerHTML += `<div class="customer" onclick="openCustomer('${c}')"><b>${c}</b><span class="${s>=0?'pos':'neg'}">${s>=0?'+':''}${s}</span></div>`;
  }
  document.getElementById('grand').textContent = (total>=0?'+':'') + total;
}

function openCustomer(n) { current = n; document.getElementById('home').classList.add('hidden'); document.getElementById('detail').classList.remove('hidden'); document.getElementById('cname').textContent = n; drawDetail(); }
function goHome() { document.getElementById('detail').classList.add('hidden'); document.getElementById('home').classList.remove('hidden'); render(); }

function addSMS() {
  let c = parseInt(document.getElementById('smsCount').value);
  let r = parseInt(document.getElementById('smsRate').value);
  if(!c || !r) return alert('SMS count aur rate daalo!');
  let total = c * r;
  data[current].tx.unshift({ v: -total, t: new Date().toLocaleString(), type: `📤 SMS ${c}×${r}=${total}` });
  document.getElementById('smsCount').value = ''; document.getElementById('smsRate').value = '';
  save(); drawDetail();
}

function addTx(sign) {
  let a = parseInt(document.getElementById('amount').value);
  if(!a) return alert('Coins daalo!');
  let label = sign > 0 ? '✅ Diye' : '❌ Mile';
  data[current].tx.unshift({ v: a*sign, t: new Date().toLocaleString(), type: label });
  document.getElementById('amount').value = '';
  save(); drawDetail();
}

function drawDetail() {
  let s = data[current].tx.reduce((a,x) => a + x.v, 0);
  document.getElementById('balance').textContent = (s>=0?'+':'') + s;
  let h = document.getElementById('history'); h.innerHTML = '';
  data[current].tx.forEach((x,i) => {
    h.innerHTML += `<div style="padding:8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;">
      <span><b>${x.type}</b><br><span style="font-size:12px;color:#666;">${x.t}</span></span>
      <span class="${x.v>=0?'pos':'neg'}">${x.v>=0?'+':''}${x.v} <button onclick="delTx(${i})" style="width:auto;padding:2px 8px;background:#ddd;border:0;border-radius:4px;">×</button></span>
    </div>`;
  });
}

function delTx(i) { if(confirm('Delete?')) { data[current].tx.splice(i,1); save(); drawDetail(); } }
render();
</script>
</body></html>
