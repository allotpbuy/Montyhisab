<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monty - Full Hisab</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f4f6f8;padding:10px;max-width:550px;margin:auto}
.card{background:white;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0002}
input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#1a73e8;color:white;font-weight:bold;border:0;cursor:pointer;border-radius:8px}
.green{background:#34a853}.red{background:#ea4335}.orange{background:#f9a825;color:#000}
.customer{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.pos{color:#34a853;font-weight:bold}.neg{color:#ea4335;font-weight:bold}
.hidden{display:none}.total{font-size:36px;font-weight:bold;text-align:center}
.flex{display:flex;gap:5px}.flex button{flex:1}
.entry{padding:8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="home">
<div class="card" style="background:#111827;color:white;">
<div style="font-size:14px;color:#888;">💰 Total Balance</div>
<div class="total" id="grand">0</div>
<div style="font-size:12px;text-align:center;color:#888;">− = Customer ko dena hai | + = Customer ne diya</div>
</div>
<div class="card">
<input id="newName" placeholder="Customer name">
<button onclick="addCustomer()">+ Customer Add</button>
</div>
<div class="card"><h3>📋 Customers</h3><div id="customers"></div></div>
</div>

<!-- ===== DETAIL ===== -->
<div id="detail" class="hidden">
<button onclick="goHome()">← Back</button>

<div class="card" style="background:#111827;color:white;">
<h2 id="cname" style="margin:0;"></h2>
<div class="total" id="balance">0</div>
<div style="font-size:12px;text-align:center;color:#888;">− = Customer ko dena hai | + = Customer ne diya</div>
</div>

<!-- ===== EDIT BALANCE ===== -->
<div class="card" style="border-left:4px solid #1a73e8;">
<h4>✏️ Edit Balance</h4>
<div class="flex">
<input id="editAmount" placeholder="New balance (e.g., 500)" style="flex:2;">
<button class="blue" onclick="editBalance()" style="flex:1;">✏️ Update</button>
</div>
</div>

<!-- ===== SMS ===== -->
<div class="card" style="border-left:4px solid #ea4335;">
<h4>📤 SMS (Customer ne SMS kiye → Aapko dena hai)</h4>
<div class="flex">
<input id="smsCount" placeholder="SMS count" style="flex:1;">
<input id="smsRate" placeholder="Rate" style="flex:1;">
</div>
<button class="red" onclick="addSMS()">📤 SMS ka hisab (−)</button>
</div>

<!-- ===== PAYMENT ===== -->
<div class="card" style="border-left:4px solid #34a853;">
<h4>💰 Customer se Paise Mile</h4>
<input id="payAmount" placeholder="Amount (e.g., 500)">
<button class="green" onclick="addPayment()">✅ Payment Received (+)</button>
</div>

<!-- ===== GIVE ===== -->
<div class="card" style="border-left:4px solid #f9a825;">
<h4>💰 Customer ko Diye</h4>
<input id="giveAmount" placeholder="Amount (e.g., 200)">
<button class="orange" onclick="addGive()" style="background:#f9a825;color:#000;">📤 Customer ko diye (−)</button>
</div>

<!-- ===== DELETE CUSTOMER ===== -->
<div class="card" style="border-left:4px solid #ea4335;">
<button class="red" onclick="deleteCustomer()" style="background:#ea4335;">🗑️ Delete This Customer</button>
</div>

<!-- ===== HISTORY ===== -->
<div class="card"><h3>📜 History</h3><div id="history"></div></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('montyData') || '{}');
let current = null;

function save() { localStorage.setItem('montyData', JSON.stringify(data)); render(); }

// ===== ADD CUSTOMER =====
function addCustomer() {
  let n = document.getElementById('newName').value.trim();
  if(!n) return alert('Naam likho!');
  if(data[n]) return alert('Already exists!');
  data[n] = { tx: [] };
  document.getElementById('newName').value = '';
  save();
}

// ===== RENDER =====
function render() {
  let box = document.getElementById('customers'); box.innerHTML = '';
  let total = 0;
  for(let c in data) {
    let s = data[c].tx.reduce((a,x) => a + x.v, 0);
    total += s;
    box.innerHTML += `<div class="customer" onclick="openCustomer('${c}')">
      <b>${c}</b>
      <span class="${s>=0?'pos':'neg'}">${s>=0?'+':''}${s}</span>
    </div>`;
  }
  document.getElementById('grand').textContent = (total>=0?'+':'') + total;
}

function openCustomer(n) {
  current = n;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');
  document.getElementById('cname').textContent = n;
  drawDetail();
}

function goHome() {
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  render();
}

// ===== EDIT BALANCE =====
function editBalance() {
  let newBalance = parseInt(document.getElementById('editAmount').value);
  if(!newBalance && newBalance !== 0) return alert('Valid balance daalo!');
  
  // Delete all existing transactions
  data[current].tx = [];
  // Add a dummy transaction with the new balance
  data[current].tx.push({ 
    v: newBalance, 
    t: new Date().toLocaleString(), 
    type: `✏️ Balance set to ${newBalance}` 
  });
  
  document.getElementById('editAmount').value = '';
  save(); 
  drawDetail();
}

// ===== DELETE CUSTOMER =====
function deleteCustomer() {
  if(!current) return;
  if(!confirm(`❌ Kya aap ${current} ko permanently delete karna chahte hain?`)) return;
  
  delete data[current];
  current = null;
  save();
  goHome();
}

// ===== SMS → MINUS (−) =====
function addSMS() {
  let c = parseInt(document.getElementById('smsCount').value);
  let r = parseInt(document.getElementById('smsRate').value);
  if(!c || !r) return alert('SMS count aur rate daalo!');
  let total = c * r;
  data[current].tx.unshift({ v: -total, t: new Date().toLocaleString(), type: `📤 SMS ${c}×${r}=${total}` });
  document.getElementById('smsCount').value = '';
  document.getElementById('smsRate').value = '';
  save(); drawDetail();
}

// ===== PAYMENT → PLUS (+) =====
function addPayment() {
  let a = parseInt(document.getElementById('payAmount').value);
  if(!a || a<1) return alert('Amount daalo!');
  data[current].tx.unshift({ v: a, t: new Date().toLocaleString(), type: `✅ Payment Received` });
  document.getElementById('payAmount').value = '';
  save(); drawDetail();
}

// ===== GIVE → MINUS (−) =====
function addGive() {
  let a = parseInt(document.getElementById('giveAmount').value);
  if(!a || a<1) return alert('Amount daalo!');
  data[current].tx.unshift({ v: -a, t: new Date().toLocaleString(), type: `📤 Customer ko diye` });
  document.getElementById('giveAmount').value = '';
  save(); drawDetail();
}

// ===== DRAW DETAIL =====
function drawDetail() {
  let s = data[current].tx.reduce((a,x) => a + x.v, 0);
  document.getElementById('balance').textContent = (s>=0?'+':'') + s;
  
  let h = document.getElementById('history'); h.innerHTML = '';
  data[current].tx.forEach((x,i) => {
    let cls = x.v >= 0 ? 'pos' : 'neg';
    let sign = x.v >= 0 ? '+' : '';
    h.innerHTML += `<div class="entry">
      <span><b>${x.type}</b><br><span style="font-size:11px;color:#666;">${x.t}</span></span>
      <span class="${cls}">${sign}${x.v} <button onclick="delTx(${i})" style="width:auto;padding:2px 8px;background:#ddd;border:0;border-radius:4px;cursor:pointer;">×</button></span>
    </div>`;
  });
}

// ===== DELETE SINGLE ENTRY =====
function delTx(i) {
  if(confirm('❌ Delete this entry?')) {
    data[current].tx.splice(i, 1);
    save(); drawDetail();
  }
}

render();
</script>
</body></html>
